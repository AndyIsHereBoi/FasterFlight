# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G

# Fabric Properties
# check these on https://fabricmc.net/develop/
# Currently targeting 1.18.2 for a compatibility test. Change these three together when switching.
minecraft_version=1.19.3
yarn_mappings=1.19.3+build.5
loader_version=0.14.21

# Minecraft 1.18.2 requires Java 17. Newer JDKs (21, 25+) desugar lambdas with class file
# versions that this version's Mixin cannot read, so the dev client must be launched on 17.
# Point JAVA_HOME at a Java 17 JDK before running ./gradlew runClient.

# Mod Properties
mod_version=1.0.0
maven_group=com.fasterflight
archives_base_name=fasterflight

# Dependencies
fabric_version=0.76.1+1.19.3
modmenu_version=5.1.0
cloth_config_version=9.1.104
