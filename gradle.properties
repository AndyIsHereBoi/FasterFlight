# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# Fabric Properties
# check these on https://fabricmc.net/develop/

# Minecraft 26.x uses the new year-based versioning. 26.1, 26.1.1 and 26.1.2 are the stable
# 26.1.x releases; Fabric API publishes one build covering all three, so a single jar spans them.
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Minecraft 26.x requires Java 25. There is no yarn_mappings entry on purpose: 26.x ships
# unobfuscated, so code compiles directly against Mojang's official names, which are also the
# names present at runtime. Adding a mappings dependency here would break that.

# Mod Properties
mod_version=1.0.0
maven_group=com.fasterflight
archives_base_name=fasterflight

# Dependencies
fabric_version=0.155.3+26.1.2
modmenu_version=18.0.1
cloth_config_version=26.1.154
