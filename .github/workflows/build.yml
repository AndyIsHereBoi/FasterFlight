name: Build

on:
  # Every branch, so a commit is verified wherever it lands rather than only once merged to the
  # default branch.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      # Java 25 is required on this branch, for two independent reasons: Minecraft 26.x targets
      # Java 25, and Fabric Loom 1.17 itself refuses to run on anything older than a JVM 21.
      #
      # This is deliberately branch-specific. The 1.18.x-1.19.x branch has its own copy of this
      # workflow pinned to Java 17, because old Mixin versions cannot run on modern JDKs.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Matches gradle/wrapper/gradle-wrapper.properties, so the wrapper performs the build.
          gradle-version: '9.5.1'

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # head_ref is the source branch on a pull_request and empty on a push, where ref_name is
          # the branch itself. Falling back to ref_name covers both without duplicating the step.
          name: fasterflight-${{ github.head_ref || github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error
