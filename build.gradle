plugins {
    // The plugin id changed from 'fabric-loom' to 'net.fabricmc.fabric-loom' in the Loom 1.17 series.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    // ModMenu
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    // Cloth Config
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // No mappings dependency: Minecraft 26.x ships unobfuscated, so code compiles against Mojang's
    // official names, which are also the names present at runtime. That also removes the need for
    // the mod/implementation split, since nothing has to be remapped.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API for client-side events, keybinds and HUD rendering
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config - required at runtime for the settings screen, and supplied by the player rather
    // than bundled. Compiled against, and also on the dev runtime classpath so the screen remains
    // testable in the dev client.
    //
    // Note the absence of modImplementation/modApi: Minecraft 26.x is unobfuscated, so mod jars need
    // no remapping and plain Gradle configurations are used for everything.
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // ModMenu - optional at runtime. Listed under "recommends" in fabric.mod.json, never "depends".
    // Compile-only, plus a dev runtime copy so the "Configure" button stays testable.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
